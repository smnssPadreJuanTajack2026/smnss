<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Biblioteca SMNSS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#eef1f5;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:260px;
height:100%;
background:#002b45;
color:white;
}

.logo{
padding:25px;
font-size:20px;
font-weight:bold;
border-bottom:1px solid rgba(255,255,255,0.1);
}

.menu-item{
padding:22px;
cursor:pointer;
border-bottom:1px solid rgba(255,255,255,0.1);
}

.menu-item:hover{
background:#003b5c;
}

.content{
margin-left:260px;
padding:30px;
}

.card{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.08);
margin-bottom:30px;
}

input,
select{
width:100%;
padding:18px;
margin-top:12px;
margin-bottom:20px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
color:white;
}

.btn-azul{
background:#004d73;
}

.btn-verde{
background:#2e8b34;
}

.btn-rojo{
background:#cc2020;
margin-top:10px;
}

.btn-naranja{
background:#f39c12;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#004d73;
color:white;
padding:16px;
}

td{
padding:16px;
border:1px solid #ddd;
text-align:center;
background:white;
}

.usuario-item{
background:#f1f1f1;
padding:15px;
margin-top:5px;
border-radius:8px;
cursor:pointer;
}

.usuario-item:hover{
background:#ddd;
}

.usuario-box{
background:#f7f7f7;
padding:25px;
border-radius:12px;
margin-top:20px;
}

#loginBox{
max-width:500px;
margin:auto;
margin-top:120px;
}

</style>

</head>

<body>

<div id="loginBox" class="card">

<h1>Biblioteca SMNSS</h1>

<select id="tipoIngreso">

<option value="bibliotecario">
Bibliotecario
</option>

<option value="visitante">
Visitante
</option>

</select>

<input
type="email"
id="correo"
placeholder="Correo bibliotecario">

<input
type="password"
id="clave"
placeholder="Contraseña bibliotecario">

<button
class="btn-azul"
onclick="ingresarSistema()">

Ingresar

</button>

</div>

<div
id="sistema"
style="display:none;">

<div class="sidebar">

<div class="logo">

Biblioteca SMNSS

</div>

<div
class="menu-item"
onclick="mostrar('inicio')">

Inicio

</div>

<div
class="menu-item"
onclick="mostrar('usuarios')">

Usuarios

</div>

<div
class="menu-item"
id="prestamosMenu"
onclick="mostrar('prestamos')">

Préstamos

</div>

</div>

<div class="content">

<div id="inicio">

<div class="card">

<h1>

Biblioteca SMNSS

</h1>

<p>

Sistema de biblioteca del
Seminario Mayor Nuestra Señora de Suyapa.

</p>

</div>

</div>

<div
id="usuarios"
style="display:none;">

<div class="card">

<h1>

Buscar Usuario

</h1>

<input
type="text"
id="buscarUsuario"
placeholder="Buscar usuario"
onkeyup="buscarUsuarios()">

<div id="listaBusqueda"></div>

<div id="informacionUsuario"></div>

</div>

<div
class="card"
id="registroUsuarios">

<h1>

Registro de Usuario

</h1>

<input
type="text"
id="nombre"
placeholder="Nombre">

<input
type="text"
id="identidad"
placeholder="Identidad">

<select id="etapa">

<option>
Configuradora
</option>

<option>
Discipulado
</option>

<option>
Teología
</option>

</select>

<button
class="btn-azul"
onclick="guardarUsuario()">

Guardar Usuario

</button>

</div>

</div>

<div
id="prestamos"
style="display:none;">

<div class="card">

<h1>

Nuevo Préstamo

</h1>

<input
type="text"
id="codigo"
placeholder="Código">

<input
type="text"
id="libro"
placeholder="Libro">

<input
type="text"
id="usuarioPrestamo"
placeholder="Usuario">

<label>

Fecha devolución

</label>

<input
type="date"
id="fecha">

<button
class="btn-azul"
onclick="registrarPrestamo()">

Registrar Préstamo

</button>

</div>

<div class="card">

<h1>

Libros Prestados

</h1>

<table>

<tr>

<th>Código</th>
<th>Libro</th>
<th>Usuario</th>
<th>Fecha devolución</th>
<th>Estado</th>
<th>Días retraso</th>
<th>Acción</th>

</tr>

<tbody id="tablaPrestamos"></tbody>

</table>

</div>

</div>

</div>

</div>

<script>

const SUPABASE_URL = "TU_URL_SUPABASE";
const SUPABASE_KEY = "TU_SUPABASE_KEY";

const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let usuarios = [];
let prestamos = [];
let modoVisitante = false;

/* LOGIN */

async function ingresarSistema(){

const tipo =
document.getElementById(
'tipoIngreso'
).value;

if(tipo === 'visitante'){

entrarVisitante();

return;

}

const correo =
document.getElementById(
'correo'
).value;

const clave =
document.getElementById(
'clave'
).value;

const { error } =
await supabaseClient.auth.signInWithPassword({

email:correo,
password:clave

});

if(error){

alert('Correo o contraseña incorrectos');

return;

}

document.getElementById(
'loginBox'
).style.display='none';

document.getElementById(
'sistema'
).style.display='block';

}

/* VISITANTE */

function entrarVisitante(){

modoVisitante = true;

document.getElementById(
'loginBox'
).style.display='none';

document.getElementById(
'sistema'
).style.display='block';

document.getElementById(
'prestamosMenu'
).style.display='none';

document.getElementById(
'registroUsuarios'
).style.display='none';

document.getElementById(
'inicio'
).innerHTML = `

<div class="card">

<h1>

Biblioteca SMNSS

</h1>

<p>

Bienvenido al sistema de consulta de la
Biblioteca Padre Juan Tajack.

</p>

<h2>

Qué es una biblioteca

</h2>

<p>

La biblioteca es un espacio académico
destinado al estudio, investigación,
lectura y formación intelectual.

</p>

<h2>

Secciones

</h2>

<ul>

<li>Recepción y préstamos</li>
<li>Sala de revistas</li>
<li>Sala de libros</li>
<li>Libros de Filosofía</li>
<li>Libros de Teología</li>

</ul>

<h2>

Reglas

</h2>

<ul>

<li>Guardar silencio y orden</li>
<li>No dañar libros</li>
<li>Devolver libros a tiempo</li>
<li>Multa de L. 5 diarios por retraso</li>

</ul>

</div>

`;

}

/* MOSTRAR */

function mostrar(id){

document.getElementById(
'inicio'
).style.display='none';

document.getElementById(
'usuarios'
).style.display='none';

document.getElementById(
'prestamos'
).style.display='none';

document.getElementById(
id
).style.display='block';

}

/* CARGAR */

async function cargarUsuarios(){

const { data } = await supabaseClient
.from('usuarios')
.select('*')
.order('nombre');

usuarios = data || [];

}

async function cargarPrestamos(){

const { data } = await supabaseClient
.from('prestamos')
.select('*')
.order('id',{ascending:false});

prestamos = data || [];

renderPrestamos();

}

/* GUARDAR USUARIO */

async function guardarUsuario(){

const nombre =
document.getElementById(
'nombre'
).value;

const identidad =
document.getElementById(
'identidad'
).value;

const etapa =
document.getElementById(
'etapa'
).value;

const { error } = await supabaseClient
.from('usuarios')
.insert([{
nombre,
identidad,
etapa
}]);

if(error){

alert('Error al guardar');

return;

}

await cargarUsuarios();

alert('Usuario guardado');

}

/* BUSCAR */

function buscarUsuarios(){

const texto =
document.getElementById(
'buscarUsuario'
).value.toLowerCase();

const lista =
document.getElementById(
'listaBusqueda'
);

lista.innerHTML='';

usuarios
.filter(u =>
u.nombre.toLowerCase()
.includes(texto)
)
.forEach((u,index)=>{

lista.innerHTML += `

<div
class="usuario-item"
onclick="mostrarUsuario(${index})">

${u.nombre}

</div>

`;

});

}

/* MOSTRAR USUARIO */

function mostrarUsuario(index){

const usuario = usuarios[index];

const historial =
prestamos.filter(
p => p.usuario === usuario.nombre
);

let filas='';

historial.forEach(h=>{

filas += `

<tr>

<td>${h.libro}</td>
<td>${h.estado}</td>

</tr>

`;

});

document.getElementById(
'informacionUsuario'
).innerHTML = `

<div class="usuario-box">

<h2>

${usuario.nombre}

</h2>

<p>

<b>Identidad:</b>
${usuario.identidad}

</p>

<p>

<b>Etapa:</b>
${usuario.etapa}

</p>

${modoVisitante ? '' : `

<button
class="btn-naranja"
onclick="editarUsuario(${usuario.id})">

Editar Usuario

</button>

<button
class="btn-rojo"
onclick="eliminarUsuario(${usuario.id})">

Eliminar Usuario

</button>

`}

<h2>

Historial de préstamos

</h2>

<table>

<tr>

<th>Libro</th>
<th>Estado</th>

</tr>

${filas}

</table>

</div>

`;

}

/* ELIMINAR */

async function eliminarUsuario(id){

const confirmar =
confirm('¿Eliminar usuario?');

if(!confirmar) return;

const { error } = await supabaseClient
.from('usuarios')
.delete()
.eq('id',id);

if(error){

alert('No se pudo eliminar');

return;

}

await cargarUsuarios();

document.getElementById(
'informacionUsuario'
).innerHTML='';

alert('Usuario eliminado');

}

/* EDITAR */

async function editarUsuario(id){

const usuario =
usuarios.find(u=>u.id===id);

const nombre =
prompt(
'Nuevo nombre',
usuario.nombre
);

if(!nombre) return;

const identidad =
prompt(
'Nueva identidad',
usuario.identidad
);

const etapa =
prompt(
'Nueva etapa',
usuario.etapa
);

const { error } = await supabaseClient
.from('usuarios')
.update({
nombre,
identidad,
etapa
})
.eq('id',id);

if(error){

alert('Error al editar');

return;

}

await cargarUsuarios();

alert('Usuario actualizado');

}

/* REGISTRAR PRESTAMO */

async function registrarPrestamo(){

const codigo =
document.getElementById(
'codigo'
).value;

const libro =
document.getElementById(
'libro'
).value;

const usuario =
document.getElementById(
'usuarioPrestamo'
).value;

const fecha =
document.getElementById(
'fecha'
).value;

const { error } = await supabaseClient
.from('prestamos')
.insert([{
codigo,
libro,
usuario,
fecha_devolucion:fecha,
estado:'Prestado',
dias_retraso:0
}]);

if(error){

alert('Error al guardar préstamo');

return;

}

await cargarPrestamos();

alert('Préstamo registrado');

}

/* DEVOLVER */

async function devolverLibro(id){

const { error } = await supabaseClient
.from('prestamos')
.update({
estado:'Devuelto'
})
.eq('id',id);

if(error){

alert('Error al devolver');

return;

}

await cargarPrestamos();

alert('Libro devuelto');

}

/* RENDER PRESTAMOS */

function renderPrestamos(){

const tabla =
document.getElementById(
'tablaPrestamos'
);

let html='';

prestamos
.filter(p=>p.estado !== 'Devuelto')
.forEach(p=>{

const hoy = new Date();

const fecha =
new Date(p.fecha_devolucion);

let dias = 0;

if(hoy > fecha){

dias = Math.floor(
(hoy - fecha)
/
(1000*60*60*24)
);

}

html += `

<tr>

<td>${p.codigo}</td>

<td>${p.libro}</td>

<td>${p.usuario}</td>

<td>${p.fecha_devolucion}</td>

<td>

${dias>0?'Vencido':'Por vencer'}

</td>

<td>

${dias}

</td>

<td>

<button
class="btn-verde"
onclick="devolverLibro(${p.id})">

Devolver

</button>

</td>

</tr>

`;

});

tabla.innerHTML = html;

}

/* INICIO */

window.onload = async function(){

await cargarUsuarios();

await cargarPrestamos();

};

</script>

</body>
</html>
