<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Biblioteca Padre Juan Tajack
</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f2f4f8;
}

/* LOGIN */

#loginBox{
max-width:420px;
margin:60px auto;
background:white;
padding:35px;
border-radius:18px;
box-shadow:0 0 20px rgba(0,0,0,0.12);
}

#loginBox h2{
text-align:center;
margin-bottom:25px;
color:#004f77;
font-size:32px;
}

/* HEADER */

.header{
background:linear-gradient(90deg,#001f3f,#004f77);
color:white;
padding:20px;
text-align:center;
position:relative;
}

.menu-btn{
position:absolute;
left:20px;
top:20px;
font-size:32px;
cursor:pointer;
}

/* MAIN */

.main{
display:flex;
}

.sidebar{
width:220px;
background:#012b46;
min-height:100vh;
transition:0.3s;
}

.sidebar.oculto{
margin-left:-220px;
}

.menu-item{
color:white;
padding:18px;
border-bottom:1px solid rgba(255,255,255,0.1);
cursor:pointer;
font-size:17px;
}

.menu-item:hover{
background:#014d7a;
}

.content{
flex:1;
padding:25px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 0 12px rgba(0,0,0,0.08);
margin-bottom:25px;
}

.card h2{
margin-bottom:18px;
color:#004f77;
}

/* INPUTS */

input,
select,
button{
width:100%;
padding:13px;
margin-top:12px;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
}

button{
background:#006b9f;
color:white;
border:none;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#004f77;
}

.btn-editar{
background:#ff9800;
}

.btn-eliminar{
background:#c62828;
}

.btn-devolver{
background:#2e7d32;
margin-top:10px;
}

/* TABLAS */

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

table th{
background:#004f77;
color:white;
padding:12px;
}

table td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

/* PANELES */

.panel{
display:none;
}

.panel.active{
display:block;
}

/* BUSCADOR */

.lista-busqueda{
border:1px solid #ccc;
background:white;
border-radius:8px;
max-height:150px;
overflow-y:auto;
display:none;
margin-top:5px;
}

.item-usuario{
padding:12px;
cursor:pointer;
border-bottom:1px solid #eee;
}

.item-usuario:hover{
background:#eef7ff;
}

/* ESTADOS */

.estado-normal{
background:#d6e8ff;
}

.estado-alerta{
background:#fff0b3;
}

.estado-vencido{
background:#ffd6d6;
}

.info-usuario{
background:#eef7ff;
padding:20px;
border-radius:12px;
margin-top:20px;
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginBox">

<h2>
Biblioteca SMNSS
</h2>

<input
type="email"
id="correo"
placeholder="Correo bibliotecario">

<input
type="password"
id="clave"
placeholder="Contraseña">

<button onclick="loginBibliotecario()">
Entrar como Bibliotecario
</button>

<button
style="background:#555;"
onclick="entrarVisitante()">

Entrar como Visitante

</button>

</div>

<!-- SISTEMA -->

<div id="sistema" style="display:none;">

<div class="header">

<div class="menu-btn"
onclick="toggleMenu()">
☰
</div>

<h1>
Biblioteca Padre Juan Tajack
</h1>

<h3>
Seminario Mayor Nuestra Señora de Suyapa
</h3>

</div>

<div class="main">

<div class="sidebar"
id="sidebar">

<div class="menu-item"
onclick="mostrarPanel('inicio')">
Inicio
</div>

<div class="menu-item"
onclick="mostrarPanel('usuarios')">
Usuarios
</div>

<div class="menu-item"
onclick="mostrarPanel('prestamos')">
Préstamos
</div>

</div>

<div class="content">

<!-- INICIO -->

<div id="inicio"
class="panel active">

<div class="card">

<h2>
Registro de Usuario
</h2>

<input
type="text"
id="nombre"
placeholder="Nombre completo">

<input
type="text"
id="identidad"
placeholder="Número de identidad">

<select id="etapa">

<option value="">
Seleccione etapa
</option>

<option value="Configuradora">
Configuradora
</option>

<option value="Discipular">
Discipular
</option>

</select>

<button onclick="guardarUsuario()">
Guardar Usuario
</button>

</div>

</div>

<!-- USUARIOS -->

<div id="usuarios"
class="panel">

<div class="card">

<h2>
Usuarios Registrados
</h2>

<select
id="listaUsuarios"
onchange="mostrarInformacionUsuario()">

<option value="">
Seleccione usuario
</option>

</select>

<div id="informacionUsuario"></div>

</div>

</div>

<!-- PRESTAMOS -->

<div id="prestamos"
class="panel">

<div class="card">

<h2>
Nuevo Préstamo
</h2>

<input
type="text"
id="codigo"
placeholder="Código préstamo">

<input
type="text"
id="libro"
placeholder="Nombre libro">

<input
type="text"
id="buscarUsuario"
placeholder="Buscar usuario"
onkeyup="filtrarUsuarios()">

<div
class="lista-busqueda"
id="listaBusqueda">
</div>

<input
type="hidden"
id="usuarioPrestamo">

<label style="display:block;margin-top:10px;">
Fecha devolución
</label>

<input
type="date"
id="fechaDevolucion">

<button onclick="registrarPrestamo()">
Registrar Préstamo
</button>

</div>

<div class="card">

<h2>
Libros Prestados
</h2>

<table>

<thead>

<tr>

<th>Código</th>
<th>Libro</th>
<th>Usuario</th>
<th>Fecha devolución</th>
<th>Estado</th>
<th>Días retraso</th>

</tr>

</thead>

<tbody id="tablaPrestamos"></tbody>

</table>

</div>

</div>

</div>

</div>

</div>

<script>

/* SUPABASE */

const supabaseUrl =
'https://wizrwignblrgkhyvtlyl.supabase.co';

const supabaseKey =
'sb_publishable_vkuYb7CtsMeKuJwKn0J8rA_q-m3hvwQ';

const supabaseClient =
window.supabase.createClient(
supabaseUrl,
supabaseKey
);

/* VARIABLES */

let usuarios = [];
let prestamos = [];
let modoVisitante = false;

/* LOGIN */

async function loginBibliotecario(){

let correo =
document.getElementById('correo').value;

let clave =
document.getElementById('clave').value;

const { error } =
await supabaseClient.auth.signInWithPassword({

email:correo,
password:clave

});

if(error){

alert('Credenciales incorrectas');
return;

}

document.getElementById('loginBox').style.display='none';

document.getElementById('sistema').style.display='block';

}

/* VISITANTE */

function entrarVisitante(){

modoVisitante = true;

document.getElementById('loginBox').style.display='none';

document.getElementById('sistema').style.display='block';

/* OCULTAR PRESTAMOS */

document.querySelectorAll('.menu-item')
.forEach(function(item){

if(item.innerText.includes('Préstamos')){

item.style.display='none';

}

});

/* OCULTAR BOTONES */

setTimeout(function(){

document.querySelectorAll('button')
.forEach(function(btn){

if(
btn.innerText.includes('Guardar') ||
btn.innerText.includes('Registrar') ||
btn.innerText.includes('Editar') ||
btn.innerText.includes('Eliminar') ||
btn.innerText.includes('Devolver')
){

btn.style.display='none';

}

});

},500);

/* INFORMACION */

document.getElementById('inicio').innerHTML = `

<div class="card">

<div style="
text-align:center;
margin-bottom:30px;
">

<h1 style="
color:#004f77;
font-size:42px;
margin-bottom:10px;
">

Biblioteca SMNSS

</h1>

<p style="
font-size:20px;
color:#555;
">

Seminario Mayor Nuestra Señora de Suyapa

</p>

</div>

<div style="
background:#eef7ff;
padding:25px;
border-radius:15px;
line-height:2;
">

<h2 style="
color:#004f77;
margin-bottom:15px;
">

¿Qué es una biblioteca?

</h2>

<p>

La biblioteca es un espacio de formación,
investigación y crecimiento intelectual,
donde los seminaristas y usuarios pueden
consultar distintos recursos académicos
y espirituales para fortalecer su aprendizaje.

</p>

</div>

<div style="
margin-top:25px;
background:white;
border:1px solid #ddd;
padding:25px;
border-radius:15px;
">

<h2 style="
color:#004f77;
margin-bottom:20px;
">

Secciones de la Biblioteca

</h2>

<div style="
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
">

<div style="
background:#f5f8fc;
padding:20px;
border-radius:12px;
">

<h3 style="color:#004f77;">
Recepción
</h3>

<p style="
margin-top:10px;
line-height:1.8;
">

Área donde se brinda información,
registro y control de préstamos
de libros.

</p>

</div>

<div style="
background:#f5f8fc;
padding:20px;
border-radius:12px;
">

<h3 style="color:#004f77;">
Sala de Revistas
</h3>

<p style="
margin-top:10px;
line-height:1.8;
">

Espacio destinado a revistas,
material informativo y lectura rápida.

</p>

</div>

<div style="
background:#f5f8fc;
padding:20px;
border-radius:12px;
">

<h3 style="color:#004f77;">
Sala de Libros
</h3>

<p style="
margin-top:10px;
line-height:1.8;
">

Contiene libros de Filosofía,
Teología y otras áreas de formación.

</p>

</div>

<div style="
background:#f5f8fc;
padding:20px;
border-radius:12px;
">

<h3 style="color:#004f77;">
Consulta de Historial
</h3>

<p style="
margin-top:10px;
line-height:1.8;
">

Los usuarios pueden consultar
sus préstamos y devoluciones.

</p>

</div>

</div>

</div>

<div style="
margin-top:25px;
background:#fff8e6;
padding:25px;
border-radius:15px;
border-left:8px solid #d4a017;
">

<h2 style="
margin-bottom:20px;
color:#7a5600;
">

Reglas de Uso

</h2>

<ul style="
padding-left:25px;
line-height:2.2;
font-size:17px;
">

<li>
Todo libro debe devolverse
en la fecha indicada.
</li>

<li>
La multa es de L. 5 por día de retraso.
</li>

<li>
Debe mantenerse el silencio y el orden.
</li>

<li>
No se permite dañar libros.
</li>

<li>
Todo préstamo queda registrado.
</li>

<li>
Los libros devueltos desaparecen
del panel de préstamos activos.
</li>

<li>
El usuario puede consultar
su historial personal.
</li>

</ul>

</div>

<div style="
margin-top:25px;
background:#e8f5e9;
padding:20px;
border-radius:15px;
text-align:center;
">

<h3 style="
color:#1b5e20;
margin-bottom:10px;
">

Biblioteca Padre Juan Tajack

</h3>

<p style="
line-height:1.8;
">

Formando integralmente
desde el estudio,
la disciplina
y el amor al conocimiento.

</p>

</div>

`;

}

/* INICIO */

window.onload = async function(){

colocarFecha();

await cargarUsuarios();

await cargarPrestamos();

};

/* MENU */

function toggleMenu(){

document
.getElementById('sidebar')
.classList
.toggle('oculto');

}

function mostrarPanel(id){

let paneles =
document.querySelectorAll('.panel');

paneles.forEach(function(p){

p.classList.remove('active');

});

document
.getElementById(id)
.classList
.add('active');

}

/* FECHA */

function colocarFecha(){

let fecha = new Date();

fecha.setDate(fecha.getDate() + 15);

let year = fecha.getFullYear();

let month =
String(fecha.getMonth()+1)
.padStart(2,'0');

let day =
String(fecha.getDate())
.padStart(2,'0');

document
.getElementById('fechaDevolucion')
.value =
year+'-'+month+'-'+day;

}

/* GUARDAR USUARIO */

async function guardarUsuario(){

if(modoVisitante){
return;
}

let nombre =
document.getElementById('nombre').value;

let identidad =
document.getElementById('identidad').value;

let etapa =
document.getElementById('etapa').value;

const { error } =
await supabaseClient
.from('usuarios')
.insert([
{
nombre:nombre,
identidad:identidad,
etapa:etapa
}
]);

if(error){

alert('Error');
return;

}

alert('Usuario guardado');

await cargarUsuarios();

}

/* CARGAR USUARIOS */

async function cargarUsuarios(){

const { data } =
await supabaseClient
.from('usuarios')
.select('*')
.order('id');

usuarios = data;

let lista =
document.getElementById('listaUsuarios');

lista.innerHTML =
'<option value="">Seleccione usuario</option>';

usuarios.forEach(function(usuario,index){

lista.innerHTML +=
'<option value="'+index+'">'+
usuario.nombre+
'</option>';

});

}

/* MOSTRAR INFO */

function mostrarInformacionUsuario(){

let index =
document.getElementById('listaUsuarios').value;

if(index===''){
return;
}

let usuario = usuarios[index];

let historial =
prestamos.filter(function(p){

return p.usuario===usuario.nombre;

});

let html='';

html += `
<div class="info-usuario">

<h3>${usuario.nombre}</h3>

<p><strong>Identidad:</strong>
${usuario.identidad}</p>

<p><strong>Etapa:</strong>
${usuario.etapa}</p>

</div>

<h3 style="margin-top:20px;">
Historial de préstamos
</h3>

<table>

<tr>

<th>Libro</th>
<th>Estado</th>

</tr>
`;

historial.forEach(function(h){

html += `
<tr>

<td>${h.libro}</td>

<td>${h.estado}</td>

</tr>
`;

});

html += `</table>`;

document.getElementById(
'informacionUsuario'
).innerHTML = html;

}

</script>

</body>
</html>
