<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Biblioteca Padre Juan Tajack</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef2f7;
}

.header{
background:linear-gradient(90deg,#002b45,#005c8f);
color:white;
padding:20px;
display:flex;
align-items:center;
gap:20px;
}

.logo{
width:70px;
height:70px;
background:white;
border-radius:12px;
padding:5px;
object-fit:contain;
}

.header-text h1{
font-size:32px;
}

.header-text p{
margin-top:5px;
font-size:16px;
}

.menu-btn{
font-size:35px;
cursor:pointer;
margin-right:10px;
}

.main{
display:flex;
}

.sidebar{
width:250px;
background:#012b46;
min-height:100vh;
transition:.3s;
}

.sidebar.oculto{
margin-left:-250px;
}

.menu-item{
padding:22px;
color:white;
font-size:20px;
cursor:pointer;
border-bottom:1px solid rgba(255,255,255,0.1);
}

.menu-item:hover{
background:#014d7a;
}

.content{
flex:1;
padding:30px;
}

.card{
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
margin-bottom:30px;
}

.card h2{
margin-bottom:25px;
color:#005c8f;
font-size:40px;
}

input,
select,
button{
width:100%;
padding:18px;
margin-top:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:20px;
}

button{
background:#005c8f;
color:white;
font-weight:bold;
border:none;
cursor:pointer;
}

button:hover{
background:#003f63;
}

.panel{
display:none;
}

.panel.active{
display:block;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#005c8f;
color:white;
padding:15px;
}

td{
padding:15px;
border:1px solid #ddd;
text-align:center;
}

.estado-normal{
background:#d9f5d9;
}

.estado-alerta{
background:#fff4b8;
}

.estado-vencido{
background:#ffd6d6;
}

.btn-devolver{
background:#2e7d32;
padding:10px;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
}

.btn-devolver:hover{
background:#1f5c24;
}

</style>

</head>

<body>

<div class="header">

<div class="menu-btn" onclick="toggleMenu()">
☰
</div>

<img src="https://i.imgur.com/5qH8Y7A.png" class="logo">

<div class="header-text">
<h1>Biblioteca Padre Juan Tajack</h1>
<p>Seminario Mayor Nuestra Señora de Suyapa</p>
</div>

</div>

<div class="main">

<div class="sidebar" id="sidebar">

<div class="menu-item" onclick="mostrarPanel('inicio')">
Inicio
</div>

<div class="menu-item" onclick="mostrarPanel('usuarios')">
Usuarios
</div>

<div class="menu-item" onclick="mostrarPanel('prestamos')">
Préstamos
</div>

</div>

<div class="content">

<div id="inicio" class="panel active">

<div class="card">

<h2>Registro de Usuario</h2>

<input type="text" id="nombre" placeholder="Nombre completo">

<input type="text" id="identidad" placeholder="Número identidad">

<select id="etapa">

<option value="">Seleccione etapa</option>

<option value="Configuradora">
Configuradora
</option>

<option value="Discipular">
Discipular
</option>

</select>

<button onclick="guardarUsuario()">
Guardar Usuario
</button>

</div>

</div>

<div id="usuarios" class="panel">

<div class="card">

<h2>Usuarios Registrados</h2>

<table>

<thead>

<tr>

<th>Nombre</th>
<th>Identidad</th>
<th>Etapa</th>

</tr>

</thead>

<tbody id="tablaUsuarios"></tbody>

</table>

</div>

</div>

<div id="prestamos" class="panel">

<div class="card">

<h2>Nuevo Préstamo</h2>

<input type="text" id="codigo" placeholder="Código préstamo">

<input type="text" id="libro" placeholder="Nombre libro">

<input type="text" id="usuarioPrestamo" placeholder="Usuario">

<label style="font-size:22px;display:block;margin-top:15px;">
Fecha devolución
</label>

<input type="date" id="fechaDevolucion">

<button onclick="registrarPrestamo()">
Registrar Préstamo
</button>

</div>

<div class="card">

<h2>Libros Prestados</h2>

<table>

<thead>

<tr>

<th>Código</th>
<th>Libro</th>
<th>Usuario</th>
<th>Fecha devolución</th>
<th>Estado</th>

</tr>

</thead>

<tbody id="tablaPrestamos"></tbody>

</table>

</div>

</div>

</div>

</div>

<script>

const supabaseUrl =
'https://wizrwignblrgkhyvtlyl.supabase.co';

const supabaseKey =
'sb_publishable_vkuYb7CtsMeKuJwKn0J8rA_q-m3hvwQ';

const supabase =
window.supabase.createClient(
supabaseUrl,
supabaseKey
);

function toggleMenu(){

document
.getElementById('sidebar')
.classList.toggle('oculto');

}

function mostrarPanel(id){

let paneles =
document.querySelectorAll('.panel');

paneles.forEach(function(p){

p.classList.remove('active');

});

document
.getElementById(id)
.classList.add('active');

}

async function guardarUsuario(){

let nombre =
document.getElementById('nombre').value;

let identidad =
document.getElementById('identidad').value;

let etapa =
document.getElementById('etapa').value;

if(
nombre==='' ||
identidad==='' ||
etapa===''
){

alert('Complete todos los campos');
return;

}

const { error } =
await supabase
.from('usuarios')
.insert([
{
nombre:nombre,
identidad:identidad,
etapa:etapa
}
]);

if(error){

console.log(error);

alert('Error al guardar usuario');

return;

}

alert('Usuario guardado');

document.getElementById('nombre').value='';
document.getElementById('identidad').value='';
document.getElementById('etapa').value='';

cargarUsuarios();

}

async function cargarUsuarios(){

const { data , error } =
await supabase
.from('usuarios')
.select('*');

if(error){

console.log(error);
return;

}

let tabla =
document.getElementById('tablaUsuarios');

tabla.innerHTML='';

data.forEach(function(u){

tabla.innerHTML += `
<tr>
<td>${u.nombre}</td>
<td>${u.identidad}</td>
<td>${u.etapa}</td>
</tr>
`;

});

}

async function registrarPrestamo(){

let codigo =
document.getElementById('codigo').value;

let libro =
document.getElementById('libro').value;

let usuario =
document.getElementById('usuarioPrestamo').value;

let fecha =
document.getElementById('fechaDevolucion').value;

if(
codigo==='' ||
libro==='' ||
usuario==='' ||
fecha===''
){

alert('Complete todos los campos');
return;

}

let hoy = new Date();
let fechaDev = new Date(fecha);

let diferencia =
Math.ceil(
(fechaDev - hoy) /
(1000*60*60*24)
);

let estado = 'En tiempo';

if(diferencia <= 3){

estado = 'Por vencer';

}

if(diferencia < 0){

estado = 'Vencido';

}

const { error } =
await supabase
.from('prestamos')
.insert([
{
codigo:codigo,
libro:libro,
usuario:usuario,
fecha_devolucion:fecha,
estado:estado,
dias_retraso:0
}
]);

if(error){

console.log(error);

alert('Error al guardar préstamo');

return;

}

alert('Préstamo registrado');

document.getElementById('codigo').value='';
document.getElementById('libro').value='';
document.getElementById('usuarioPrestamo').value='';

cargarPrestamos();

}

async function cargarPrestamos(){

const { data , error } =
await supabase
.from('prestamos')
.select('*');

if(error){

console.log(error);
return;

}

let tabla =
document.getElementById('tablaPrestamos');

tabla.innerHTML='';

data.forEach(function(p){

let clase='estado-normal';

if(p.estado==='Por vencer'){

clase='estado-alerta';

}

if(p.estado==='Vencido'){

clase='estado-vencido';

}

tabla.innerHTML += `
<tr class="${clase}">
<td>${p.codigo}</td>
<td>${p.libro}</td>
<td>${p.usuario}</td>
<td>${p.fecha_devolucion}</td>
<td>${p.estado}</td>
</tr>
`;

});

}

window.onload = function(){

let fecha = new Date();

fecha.setDate(fecha.getDate()+15);

let year = fecha.getFullYear();

let month =
String(fecha.getMonth()+1)
.padStart(2,'0');

let day =
String(fecha.getDate())
.padStart(2,'0');

document.getElementById('fechaDevolucion').value =
year+'-'+month+'-'+day;

cargarUsuarios();

cargarPrestamos();

};

</script>

</body>
</html>
