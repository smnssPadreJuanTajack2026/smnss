<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Biblioteca Padre Juan Tajack</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f2f4f8;
}

.header{
background:#003b5c;
color:white;
padding:20px;
text-align:center;
font-size:24px;
}

.container{
display:flex;
}

.menu{
width:220px;
background:#01263d;
min-height:100vh;
}

.menu button{
width:100%;
padding:15px;
border:none;
background:none;
color:white;
font-size:16px;
cursor:pointer;
text-align:left;
}

.menu button:hover{
background:#014b75;
}

.content{
flex:1;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select,button{
width:100%;
padding:12px;
margin-top:10px;
}

button{
background:#004f77;
color:white;
border:none;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table th{
background:#004f77;
color:white;
padding:10px;
}

table td{
padding:10px;
border:1px solid #ccc;
text-align:center;
}

.estado-normal{
background:#d6ecff;
}

.estado-alerta{
background:#fff3b0;
}

.estado-vencido{
background:#ffcccc;
}

.seccion{
display:none;
}

.activa{
display:block;
}

</style>
</head>

<body>

<div class="header">
Biblioteca Padre Juan Tajack
</div>

<div class="container">

<div class="menu">

<button onclick="mostrar('inicio')">
Inicio
</button>

<button onclick="mostrar('prestamos')">
Préstamos
</button>

</div>

<div class="content">

<div id="inicio" class="seccion activa">

<div class="card">

<h2>Registrar Usuario</h2>

<input type="text" id="nombre" placeholder="Nombre">

<input type="text" id="identidad" placeholder="Identidad">

<select id="etapa">
<option value="">Seleccione etapa</option>
<option>Configuradora</option>
<option>Discipular</option>
</select>

<button onclick="registrarUsuario()">
Guardar Usuario
</button>

</div>

</div>

<div id="prestamos" class="seccion">

<div class="card">

<h2>Nuevo Préstamo</h2>

<input type="text" id="codigo" placeholder="Código">

<input type="text" id="libro" placeholder="Libro">

<select id="usuario"></select>

<input type="date" id="fecha">

<button onclick="registrarPrestamo()">
Guardar Préstamo
</button>

</div>

<div class="card">

<h2>Préstamos</h2>

<table>

<thead>
<tr>
<th>Código</th>
<th>Libro</th>
<th>Usuario</th>
<th>Fecha</th>
<th>Estado</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

</table>

</div>

</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://wizrwignblrgkhyvtlyl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_vkuYb7CtsMeKuJwKn0J8rA_q-m3hvwQ";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

function mostrar(id){

document.querySelectorAll('.seccion')
.forEach(s=>{
s.classList.remove('activa');
});

document.getElementById(id)
.classList.add('activa');

}

async function registrarUsuario(){

let nombre =
document.getElementById('nombre').value;

let identidad =
document.getElementById('identidad').value;

let etapa =
document.getElementById('etapa').value;

if(nombre=='' || identidad=='' || etapa==''){
alert('Complete todo');
return;
}

let { error } =
await supabase
.from('usuarios')
.insert([{
nombre,
identidad,
etapa
}]);

if(error){
alert('Error guardando');
console.log(error);
return;
}

alert('Usuario guardado');

cargarUsuarios();

}

async function cargarUsuarios(){

let { data } =
await supabase
.from('usuarios')
.select('*');

let select =
document.getElementById('usuario');

select.innerHTML='';

data.forEach(u=>{

select.innerHTML +=
`<option>${u.nombre}</option>`;

});

}

async function registrarPrestamo(){

let codigo =
document.getElementById('codigo').value;

let libro =
document.getElementById('libro').value;

let usuario =
document.getElementById('usuario').value;

let fecha =
document.getElementById('fecha').value;

let { error } =
await supabase
.from('prestamos')
.insert([{
codigo,
libro,
usuario,
fecha_devolucion:fecha,
devuelto:false
}]);

if(error){
alert('Error guardando préstamo');
console.log(error);
return;
}

alert('Préstamo guardado');

cargarPrestamos();

}

async function cargarPrestamos(){

let { data } =
await supabase
.from('prestamos')
.select('*');

let tabla =
document.getElementById('tabla');

tabla.innerHTML='';

let hoy = new Date();

data.forEach(p=>{

let fecha =
new Date(p.fecha_devolucion);

let dias =
Math.ceil((fecha-hoy)/(1000*60*60*24));

let estado = 'Normal';
let clase = 'estado-normal';

if(dias <= 3){
estado='Por vencer';
clase='estado-alerta';
}

if(dias < 0){
estado='Vencido';
clase='estado-vencido';
}

tabla.innerHTML += `

<tr class="${clase}">

<td>${p.codigo}</td>

<td>${p.libro}</td>

<td>${p.usuario}</td>

<td>${p.fecha_devolucion}</td>

<td>${estado}</td>

</tr>

`;

});

}

cargarUsuarios();
cargarPrestamos();

</script>

</body>
</html>
