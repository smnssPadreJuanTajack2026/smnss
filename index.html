<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Biblioteca Padre Juan Tajack</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
font-family:Arial;
background:#f2f4f8;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
color:#004f77;
margin-bottom:15px;
}

input,select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
}

button{
background:#004f77;
color:white;
border:none;
cursor:pointer;
font-weight:bold;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table th{
background:#004f77;
color:white;
padding:10px;
}

table td{
padding:10px;
border:1px solid #ccc;
text-align:center;
}

.estado-normal{
background:#d6e8ff;
}

.estado-alerta{
background:#fff0b3;
}

.estado-vencido{
background:#ffd6d6;
}

</style>

</head>

<body>

<div class="card">

<h2>Registrar Usuario</h2>

<input type="text" id="nombre" placeholder="Nombre completo">

<input type="text" id="identidad" placeholder="Número identidad">

<select id="etapa">
<option value="">Seleccione etapa</option>
<option value="Configuradora">Configuradora</option>
<option value="Discipular">Discipular</option>
</select>

<button onclick="registrarUsuario()">
Guardar Usuario
</button>

</div>

<div class="card">

<h2>Nuevo Préstamo</h2>

<input type="text" id="codigo" placeholder="Código">

<input type="text" id="libro" placeholder="Libro">

<select id="usuario"></select>

<input type="date" id="fecha">

<button onclick="registrarPrestamo()">
Registrar Préstamo
</button>

</div>

<div class="card">

<h2>Préstamos</h2>

<table>

<thead>

<tr>
<th>Código</th>
<th>Libro</th>
<th>Usuario</th>
<th>Fecha devolución</th>
<th>Estado</th>
</tr>

</thead>

<tbody id="tabla"></tbody>

</table>

</div>

<script>

const SUPABASE_URL =
"https://wizrwignblrgkhyvtlyl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_vkuYb7CtsMeKuJwKn0J8rA_q-m3hvwQ";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function registrarUsuario(){

let nombre =
document.getElementById("nombre").value;

let identidad =
document.getElementById("identidad").value;

let etapa =
document.getElementById("etapa").value;

if(nombre==="" || identidad==="" || etapa===""){
alert("Complete todos los campos");
return;
}

await supabase
.from("usuarios")
.insert([{
nombre,
identidad,
etapa
}]);

alert("Usuario registrado");

document.getElementById("nombre").value="";
document.getElementById("identidad").value="";
document.getElementById("etapa").value="";

cargarUsuarios();

}

async function cargarUsuarios(){

let { data } =
await supabase
.from("usuarios")
.select("*");

let select =
document.getElementById("usuario");

select.innerHTML="";

data.forEach(u=>{

select.innerHTML +=
`<option>${u.nombre}</option>`;

});

}

async function registrarPrestamo(){

let codigo =
document.getElementById("codigo").value;

let libro =
document.getElementById("libro").value;

let usuario =
document.getElementById("usuario").value;

let fecha =
document.getElementById("fecha").value;

if(codigo==="" || libro==="" || usuario==="" || fecha===""){
alert("Complete todos los campos");
return;
}

await supabase
.from("prestamos")
.insert([{
codigo,
libro,
usuario,
fecha_devolucion:fecha,
devuelto:false
}]);

alert("Préstamo registrado");

cargarPrestamos();

}

async function cargarPrestamos(){

let { data } =
await supabase
.from("prestamos")
.select("*");

let tabla =
document.getElementById("tabla");

tabla.innerHTML="";

let hoy = new Date();

data.forEach(p=>{

if(!p.devuelto){

let fecha =
new Date(p.fecha_devolucion);

let diferencia =
Math.ceil(
(fecha-hoy)/(1000*60*60*24)
);

let estado = "En tiempo";
let clase = "estado-normal";

if(diferencia < 0){
estado = "Vencido";
clase = "estado-vencido";
}else if(diferencia <= 1){
estado = "Entrega hoy";
clase = "estado-alerta";
}

tabla.innerHTML += `

<tr class="${clase}">

<td>${p.codigo}</td>

<td>${p.libro}</td>

<td>${p.usuario}</td>

<td>${p.fecha_devolucion}</td>

<td>${estado}</td>

</tr>

`;

}

});

}

cargarUsuarios();
cargarPrestamos();

</script>

</body>
</html>
